[pytest]
testpaths = flatworld/tests
markers =
    slow: a slow standing check (production-resolution ensemble); deselect with -m "not slow"
# These tests exercise drivers, scripts or data files from the larger private project that are not
# part of this repository (production run drivers, map-building scripts, the collimator shade file).
# They are deselected rather than edited.
addopts =
    --deselect flatworld/tests/test_diurnal_sun.py::test_shade_world_phase_mean
    --deselect flatworld/tests/test_phy20_virtual_temp_exact.py::test_the_model_function_agrees_with_the_readonly_phy19_instrument
    --deselect flatworld/tests/test_stagec_convergence.py::test_geo_climate_testcases_solves_on_the_deliverable_standard_and_gates
    --deselect flatworld/tests/test_stagec_convergence.py::test_refine_nests_share_the_parents_standard_and_gate_per_tile
    --deselect flatworld/tests/test_stagec_convergence.py::test_the_consumers_expose_the_override_and_record_what_they_read
    --deselect flatworld/tests/test_stagec_convergence.py::test_the_audit_flags_truncated_and_unconverged_products
    --deselect flatworld/tests/test_stagec_convergence.py::test_the_refine_prov_records_the_standard_the_tiles_solved_to
    --deselect flatworld/tests/test_stagec_convergence.py::test_as1_arms_solve_on_the_deliverable_standard
    --deselect flatworld/tests/test_stagec_convergence.py::test_the_refine_driver_refuses_an_unconverged_parent_before_the_backbone
    --deselect flatworld/tests/test_stagec_convergence.py::test_a_geoclim_cache_hit_counts_only_a_product_on_the_standard
